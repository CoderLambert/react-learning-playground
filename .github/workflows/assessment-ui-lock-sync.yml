name: Assessment UI Tailwind verification

on:
  push:
    branches:
      - codex/assessment-finalization

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/assessment-finalization

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node tests
        run: node --test tests/*.mjs worker/deepseek-assistant/test/*.test.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mock Chromium E2E
        run: npm run test:e2e:mock

      - name: Wrangler dry-run
        run: npm exec --yes --package=wrangler@4.36.0 -- wrangler deploy --dry-run --config worker/deepseek-assistant/wrangler.jsonc
