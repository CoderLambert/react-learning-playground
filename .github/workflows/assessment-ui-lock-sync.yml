name: Assessment UI Tailwind lock sync

on:
  push:
    branches:
      - codex/assessment-finalization

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/assessment-finalization

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Node tests
        run: node --test tests/*.mjs worker/deepseek-assistant/test/*.test.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ui): sync Tailwind lockfile"
          git push origin HEAD:codex/assessment-finalization
