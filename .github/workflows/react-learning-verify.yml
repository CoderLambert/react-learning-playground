name: React Learning Verify

on:
  pull_request:
    branches:
      - integration/react-complete-learning
      - integration/react-learning-workbench
      - integration/deepseek-ai-assistant
      - main
  push:
    branches:
      - integration/react-complete-learning
      - integration/react-learning-workbench
      - integration/deepseek-ai-assistant
      - main

permissions:
  contents: read

concurrency:
  group: react-learning-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: React Learning Verify / verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record merge-candidate evidence
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"

          printf 'BASE_SHA=%s\nHEAD_SHA=%s\nTESTED_SHA=%s\nRUN_ID=%s\n' \
            "$BASE_SHA" "$HEAD_SHA" "$TESTED_SHA" "$RUN_ID"

          {
            echo "### Merge-candidate evidence"
            echo
            echo "- BASE_SHA: \`$BASE_SHA\`"
            echo "- HEAD_SHA: \`$HEAD_SHA\`"
            echo "- TESTED_SHA: \`$TESTED_SHA\`"
            echo "- RUN_ID: \`$RUN_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Required repository verification
        run: npm run verify:required
