name: React Learning Verify

on:
  pull_request:
    branches:
      - integration/react-complete-learning
      - integration/react-learning-workbench
      - main
  push:
    branches:
      - integration/react-complete-learning
      - integration/react-learning-workbench
      - main

permissions:
  contents: read

concurrency:
  group: react-learning-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
