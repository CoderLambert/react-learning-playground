name: MDX Runtime Verify

on:
  pull_request:
    branches:
      - main
      - integration/react-learning-workbench

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mdx-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Verify lazy MDX chunk
        shell: bash
        run: |
          set -euo pipefail
          ls -lah dist/assets
          find dist/assets -maxdepth 1 -type f -name '*runtime-smoke*.js' -print -quit | grep -q runtime-smoke
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: CI=true npm run test:e2e
      - name: Preview HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/react-learning-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; cat /tmp/react-learning-preview.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/react-learning-playground/ > /tmp/react-learning-home.html; then
              grep -q '<div id="root"></div>' /tmp/react-learning-home.html
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Remove temporary validation workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mdx-runtime-verify.yml
          git commit -m "chore: remove temporary MDX validation workflow"
          git push origin HEAD:feat/mdx-runtime
