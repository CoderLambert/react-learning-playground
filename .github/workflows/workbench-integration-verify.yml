name: Workbench Integration Verify

on:
  pull_request:
    branches:
      - integration/react-learning-workbench
      - integration/deepseek-ai-assistant
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine browser verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_browser=false
          while IFS= read -r file; do
            case "$file" in
              src/App.jsx|src/App.css|src/main.jsx|src/ai/*|src/assessment/*|src/components/*|src/demos/*|src/lib/*|src/workbench/*|tests/assessment-*.test.mjs|tests/product-closure-contract.test.mjs|tests/tool-schema-validation.test.mjs|tests/integration/assessment-lifecycle.test.mjs|tests/e2e/*|playwright.config.*|package.json|package-lock.json|vite.config.js|.github/workflows/workbench-integration-verify.yml)
                run_browser=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "run_browser=$run_browser" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        run: npm ci

      - name: Build
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        env:
          VITE_AI_ASSISTANT_URL: http://127.0.0.1:4173/__ai-test__
        run: npm run build

      - name: Install Playwright Chromium
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Preview HTTP smoke
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/workbench-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; cat /tmp/workbench-preview.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/react-learning-playground/ > /tmp/workbench-home.html; then
              grep -q '<div id="root"></div>' /tmp/workbench-home.html
              exit 0
            fi
            sleep 1
          done
          echo "Preview did not become healthy" >&2
          exit 1

      - name: Upload Playwright artifacts
        if: ${{ failure() && steps.scope.outputs.run_browser == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
