name: Workbench Integration Verify

on:
  pull_request:
    branches:
      - integration/react-learning-workbench
      - integration/deepseek-ai-assistant
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Workbench Integration Verify / verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine browser verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "run_browser=true" >> "$GITHUB_OUTPUT"
            echo "browser_tier=FULL" >> "$GITHUB_OUTPUT"
            echo "browser_domain=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | node scripts/classify-browser-impact.mjs \
            >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        run: npm ci

      - name: Build
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        env:
          VITE_AI_ASSISTANT_URL: http://127.0.0.1:4173/__ai-test__
        run: npm run build

      - name: Install Playwright Chromium
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (FULL)
        if: ${{ steps.scope.outputs.run_browser == 'true' && steps.scope.outputs.browser_tier == 'FULL' }}
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Browser E2E (DOMAIN)
        if: ${{ steps.scope.outputs.run_browser == 'true' && steps.scope.outputs.browser_tier == 'DOMAIN' }}
        env:
          CI: "true"
          BROWSER_DOMAIN: ${{ steps.scope.outputs.browser_domain }}
        shell: bash
        run: |
          set -euo pipefail

          core=(tests/e2e/app-shell.spec.js)
          case "$BROWSER_DOMAIN" in
            ai)
              domain=(tests/e2e/ai-*.spec.js tests/e2e/closure-ai-followup.spec.js)
              ;;
            assessment)
              domain=(tests/e2e/assessment-*.spec.js)
              ;;
            workbench)
              domain=(tests/e2e/workbench-*.spec.js)
              ;;
            *)
              echo "Unmapped DOMAIN browser suite: $BROWSER_DOMAIN" >&2
              exit 1
              ;;
          esac

          npx playwright test "${core[@]}" "${domain[@]}"

      - name: Preview HTTP smoke
        if: ${{ steps.scope.outputs.run_browser == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/workbench-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; cat /tmp/workbench-preview.log' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/react-learning-playground/ > /tmp/workbench-home.html; then
              grep -q '<div id="root"></div>' /tmp/workbench-home.html
              exit 0
            fi
            sleep 1
          done
          echo "Preview did not become healthy" >&2
          exit 1

      - name: Upload Playwright artifacts
        if: ${{ failure() && steps.scope.outputs.run_browser == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: workbench-playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
