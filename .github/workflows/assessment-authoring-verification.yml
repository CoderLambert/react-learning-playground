name: Assessment authoring verification

on:
  push:
    branches:
      - fix/assessment-self-contained-questions

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Node tests
        run: node --test tests/*.mjs worker/deepseek-assistant/test/*.test.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Mock browser E2E
        run: npm run test:e2e:mock

      - name: Worker dry-run
        run: npm exec --yes --package=wrangler@4.36.0 -- wrangler deploy --dry-run --config worker/deepseek-assistant/wrangler.jsonc

      # Keep this workflow branch-local; it is removed after the verification run.
